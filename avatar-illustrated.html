<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Harshini — Illustrated Avatar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#FBF1F0; --text:#3A2422; --muted:#8C6E6B; --pink:#F08A99; --ring:#F6C9CF; }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; padding:24px 16px; overflow-x:hidden;
  }
  .stage{position:relative; width:min(380px, 84vw); aspect-ratio:1;}
  .stage.boing{animation:boing .5s cubic-bezier(.3,1.6,.5,1) 1;}
  @keyframes boing{0%{transform:scale(1);} 30%{transform:scale(1.04,.96);} 60%{transform:scale(.98,1.02);} 100%{transform:scale(1);}}
  .stage.shake{animation:shake .32s ease-in-out 2;}
  @keyframes shake{25%{transform:translateX(-5px) rotate(-1deg);} 75%{transform:translateX(5px) rotate(1deg);}}
  .face{
    position:absolute; inset:0; border-radius:50%; overflow:hidden; cursor:pointer;
    background:radial-gradient(circle at 50% 38%, #FFF7F5, #F5D6D7);
    box-shadow:0 0 0 8px var(--ring), 0 18px 40px rgba(160,80,90,.25);
    -webkit-tap-highlight-color:transparent;
  }
  .rig{position:absolute; inset:0; will-change:transform; transform-origin:50% 90%;}
  .rig img, .eyes{position:absolute; inset:0; width:100%; height:100%; user-select:none; -webkit-user-drag:none; pointer-events:none;}
  .eyes{
    --eyemask:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA0gAAANICAYAAAD958/bAAAWMUlEQVR4nO3d25OkZ13A8e/sid2cTEhCJCFBwhkKQU7KQcSonLRKscoSFSwtreLCv8Aq/wKvvVAvvFTLAtEqLrwAjCWgJaiQcNCAwQBlCBACOZLsZseLZ95Mb2/P7OxhtqdnPp+qrd1Mv939dPqpd36/9/c8v7cAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAIC9am3ZAwCA/Wh9fX1XX39tza9wgN1waNkDAAAA2CskSAAAABskSAAAABuOLHsAAMAZFm0u2t0NTQA8Q4IEAMs1mxCtJxkCWCoJEgDsrikB2irxmf35oeqq6vjMz05Wj1antnkNAC4RCRIA7K4pqTncmXt/D1XXVze1+fv4iurV1e0zx95XfaS6d9dHCoAECdi/LuA+NPNLnS7GRb+W+9ws1wXOn/knXbHx58rqJdXNbc6NI9WLGwnRVDE6Wj2vumHmNb9aPVw9UX2nUUm66PssmV8Aizk7AvvWRQaQR7rwc+Tp6umLefMSwC7bBc6fQ425c0MjGXpF9crq2dXLG8nPbBXpyuqaRnWpRoI1/8U/Ud1dfbz6ZPXt6qHqW9VTjfl2+nwHan4BLObsCOxb5xngHm4Eq8cbwe3Lqqsv8K0fqr5c/aCRKD1W/XDumEXVhjMPEMAu1XnMn7XqRGO+/FijUvSq6jXVbdVzq2ON6tDhBc+fGjNs9YWvNxKgh6qvV9+v/qf6fPW9jX/fUz3SeSRK5hfA     -webkit-mask-image:var(--eyemask); mask-image:var(--eyemask);
    -webkit-mask-size:100% 100%; mask-size:100% 100%;
  }
  #iris{will-change:transform;}
  .ov{opacity:0; transition:opacity .18s ease;}
  .ov.on{opacity:1;}
  #blink{transition-duration:.06s;}
  .blush{position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .25s ease; mix-blend-mode:multiply;
    background:radial-gradient(ellipse 13% 8% at 36% 47%, rgba(255,70,80,.75), transparent 70%),
               radial-gradient(ellipse 13% 8% at 63% 47%, rgba(255,70,80,.75), transparent 70%);}
  .blush.on{opacity:1;}
  .blush.mad{opacity:1;
    background:radial-gradient(ellipse 12% 7% at 36% 47%, rgba(255,40,60,.65), transparent 72%),
               radial-gradient(ellipse 12% 7% at 63% 47%, rgba(255,40,60,.65), transparent 72%);}
  .bubble{
    position:absolute; top:-3%; right:-8%; background:#fff; color:var(--text); z-index:2;
    font-weight:700; font-size:14px; padding:9px 13px; border-radius:14px; line-height:1.3; max-width:230px;
    opacity:0; transform:translateY(6px) scale(.9); transition:all .2s ease; pointer-events:none;
    box-shadow:0 6px 18px rgba(160,80,90,.25);
  }
  .bubble small{display:block; font-weight:500; font-size:11.5px; color:var(--muted);}
  .bubble::after{content:""; position:absolute; left:16px; bottom:-7px; border:8px solid transparent; border-top-color:#fff; border-bottom:0;}
  .bubble.show{opacity:1; transform:translateY(0) scale(1);}
  .fx{position:absolute; pointer-events:none; z-index:2; animation:float 1.3s ease-out forwards;}
  .fx.z{font-weight:700; color:#8C7FB8; font-size:20px; animation:zfloat 2.2s ease-out forwards;}
  @keyframes float{0%{opacity:0; transform:translateY(0) scale(.6);} 20%{opacity:1;} 100%{opacity:0; transform:translateY(-70px) scale(1.1);}}
  @keyframes zfloat{0%{opacity:0; transform:translate(0,0) scale(.6);} 20%{opacity:1;} 100%{opacity:0; transform:translate(30px,-60px) scale(1.25);}}
  .hint{margin-top:30px; font-size:13px; color:var(--muted); text-align:center;}
  .links{margin-top:14px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
  .links a{color:var(--text); text-decoration:none; font-size:13px; border:1px solid var(--ring); background:#fff; padding:6px 12px; border-radius:999px;}
  .links a:hover{border-color:var(--pink); color:#C2566A;}
  @media (prefers-reduced-motion: reduce){ .fx{display:none;} .stage.boing, .stage.shake{animation:none;} .ov{transition:none;} }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="bubble" id="bubble"></div>
  <div class="face" id="face" role="img" aria-label="Illustrated Harshini whose eyes follow your cursor">
    <div class="rig" id="rig">
      <img src="assets/portrait/base.webp" alt="">
      <div class="eyes"><img src="assets/portrait/iris.webp" id="iris" alt=""></div>
      <img src="assets/portrait/hover.webp" class="ov" id="hover" alt="">
      <img src="assets/portrait/blink.webp" class="ov" id="blink" alt="">
      <img src="assets/portrait/happy.webp" class="ov" id="happy" alt="">
      <img src="assets/portrait/thinking.webp" class="ov" id="thinking" alt="">
      <img src="assets/portrait/surprised.webp" class="ov" id="surprised" alt="">
      <img src="assets/portrait/blush.webp" class="ov" id="blushFace" alt="">
      <img src="assets/portrait/cross.webp" class="ov" id="cross" alt="">
      <img src="assets/portrait/shades.webp" class="ov" id="shades" alt="">
      <div class="blush" id="blush"></div>
    </div>
  </div>
</div>
<div class="hint">Move your mouse (or tap) around her 👀 · hover · click to say hi · double-click for something cool</div>
<div class="links">
  <a href="index.html">📊 Dashboard resume</a>
  <a href="harshini_mitra_rpg.html">🎮 Game resume</a>
</div>

<script>
(() => {
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);
  const stage = $('stage'), face = $('face'), rig = $('rig'), iris = $('iris'), bubble = $('bubble'), blush = $('blush');
  const ov = {hover: $('hover'), blink: $('blink'), happy: $('happy'), thinking: $('thinking'),
              surprised: $('surprised'), blush: $('blushFace'), cross: $('cross'), shades: $('shades')};
  const set = (k, on) => ov[k].classList.toggle('on', on);

  // eye centre and how far the irises can travel, as fractions of the picture
  const EYE = {x: 0.49, y: 0.362}, TRAVEL = {x: 0.0088, y: 0.0032};

  let mood = 'normal', lastActive = performance.now(), hovering = false, thinking = false;
  const target = {x: 0, y: 0}, pos = {x: 0, y: 0}, vel = {x: 0, y: 0};

  function say(html, ms = 1800){
    bubble.innerHTML = html;
    bubble.classList.add('show');
    clearTimeout(say.t);
    say.t = setTimeout(() => bubble.classList.remove('show'), ms);
  }
  function fx(text, cls, x, y, life){
    const s = document.createElement('span');
    s.className = 'fx ' + (cls || '');
    s.textContent = text;
    s.style.left = x + '%'; s.style.top = y + '%';
    stage.appendChild(s);
    setTimeout(() => s.remove(), life);
  }

  /* ---- looking at the pointer ---- */
  function aim(clientX, clientY){
    const r = face.getBoundingClientRect();
    const dx = clientX - (r.left + r.width * EYE.x), dy = clientY - (r.top + r.height * EYE.y);
    const reach = Math.max(r.width * 0.8, 240);
    target.x = Math.max(-1, Math.min(1, dx / reach));
    target.y = Math.max(-1, Math.min(1, dy / reach));
    hovering = Math.hypot(clientX - (r.left + r.width / 2), clientY - (r.top + r.height / 2)) < r.width / 2;
  }
  function activity(){
    lastActive = performance.now();
    if (thinking) { thinking = false; set('thinking', false); }
    if (mood === 'sleeping') wake();
  }
  window.addEventListener('pointermove', e => { activity(); aim(e.clientX, e.clientY); });
  window.addEventListener('pointerdown', e => { activity(); aim(e.clientX, e.clientY); });
  window.addEventListener('keydown', activity);
  window.addEventListener('scroll', activity, {passive: true});
  document.addEventListener('pointerleave', () => { hovering = false; });

  /* ---- idle: glance around, then doze off (sooner late at night) ---- */
  let zTimer;
  setInterval(() => {
    if (mood !== 'normal') return;
    const still = performance.now() - lastActive;
    const hour = new Date().getHours();
    const night = hour >= 23 || hour < 5;
    if (still > (night ? 6000 : 16000)) return sleep();
    if (!night && still > 6000 && !thinking) {
      thinking = true;
      set('thinking', true);
      target.x = 0.5; target.y = -0.6;
      say('Hmm… 🤔 <small>pondering a SQL query</small>', 2600);
      return;
    }
    if (thinking) return;
    if (still > 3000) {
      hovering = false;
      target.x = Math.random() * 1.4 - 0.7;
      target.y = Math.random() * 0.8 - 0.4;
    }
  }, 1800);

  function sleep(){
    mood = 'sleeping';
    thinking = false; set('thinking', false);
    target.x = 0; target.y = 0.4;
    set('blink', true);
    say('zzz… <small>dreaming of dashboards</small>', 2600);
    let big = false;
    const puff = () => { fx(big ? 'Z' : 'z', 'z', 62, 18, 2200); big = !big; };
    puff(); zTimer = setInterval(puff, 1000);
  }
  function wake(){
    mood = 'normal';
    clearInterval(zTimer);
    set('blink', false);
    set('surprised', true);
    say('Oh! 😳 <small>I was totally awake</small>');
    setTimeout(() => set('surprised', false), 1100);
  }

  const special = () => ['happy', 'thinking', 'surprised', 'blush', 'cross', 'shades'].some(k => ov[k].classList.contains('on'));

  /* ---- blinking ---- */
  function blink(){
    if (mood === 'normal' && !special()) {
      set('blink', true);
      setTimeout(() => { if (mood === 'normal') set('blink', false); }, 120);
    }
    setTimeout(blink, 2600 + Math.random() * 3800);
  }
  if (!reduceMotion) setTimeout(blink, 1800);

  /* ---- animation loop: spring-follow eyes and head, breathing ---- */
  function frame(t){
    if (reduceMotion) { pos.x = target.x; pos.y = target.y; }
    else {
      for (const k of ['x', 'y']) {
        vel[k] += (target[k] - pos[k]) * 0.09;
        vel[k] *= 0.76;
        pos[k] += vel[k];
      }
    }
    iris.style.transform = `translate(${pos.x * TRAVEL.x * 100}%, ${pos.y * TRAVEL.y * 100}%)`;
    if (!reduceMotion) {
      const breath = Math.sin(t / 1700);
      rig.style.transform =
        `perspective(900px) rotateY(${pos.x * 5}deg) rotateX(${-pos.y * 3}deg) ` +
        `translate(${pos.x * 1.2}%, ${pos.y * 0.8 + breath * 0.5}%) rotate(${pos.x * 1.5 + Math.sin(t / 2600) * 0.5}deg) ` +
        `scale(${1.02 + breath * 0.006})`;
    }
    if (mood === 'normal') set('hover', hovering && !special());
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---- clicks: happy smile + a line; poke too much and she gets cross ---- */
  const lines = [
    "Hi, I'm Harshini! ✨<small>Data &amp; Analytics · Sydney</small>",
    "Let's build a dashboard 📊<small>Power BI · QuickSight · Tableau</small>",
    "Open to part-time roles 💼<small>say hi on the Contact page</small>",
    "SQL, Python, pandas ✔<small>happy to wrangle your data</small>",
  ];
  let lineIdx = 0, clicks = [];
  face.addEventListener('click', () => {
    if (mood === 'sleeping') return wake();
    if (mood === 'cross') return;
    const now = performance.now();
    clicks = clicks.filter(t => now - t < 5000);
    clicks.push(now);
    if (clicks.length > 10) return getCross();
    const shy = clicks.length >= 7;
    if (shy) say(clicks.length >= 9 ? 'Okay, okay, that\'s enough 😅' : 'Hehe, that tickles! 🙈');
    else say(lines[lineIdx++ % lines.length]);
    set('shades', false);
    set('blush', shy);
    set('happy', !shy);
    stage.classList.remove('boing'); void stage.offsetWidth; stage.classList.add('boing');
    if (!reduceMotion && clicks.length < 7) for (let i = 0; i < 3; i++) fx('✨', '', 14 + Math.random() * 72, 18 + Math.random() * 40, 1400);
    clearTimeout(face.t);
    face.t = setTimeout(() => { set('happy', false); set('blush', false); }, 1400);
  });

  function getCross(){
    mood = 'cross'; clicks = [];
    clearTimeout(face.t);
    ['happy', 'hover', 'blush', 'shades'].forEach(k => set(k, false));
    set('cross', true);
    blush.classList.add('mad');
    stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake');
    target.x = -0.8; target.y = 0;
    say('Hey! Stop poking 😤<small>-10 HP</small>', 2600);
    if (!reduceMotion) for (let i = 0; i < 4; i++) setTimeout(() => fx('💢', '', 18 + Math.random() * 60, 10 + Math.random() * 25, 1100), i * 300);
    setTimeout(() => {
      blush.classList.remove('mad');
      set('cross', false);
      mood = 'normal';
      say('…fine. Hi. 🙂');
    }, 3200);
  }

  /* ---- sunglasses: double-click, or the Konami code ---- */
  function shades(ms, line){
    if (mood !== 'normal') return;
    clearTimeout(face.t);
    ['happy', 'blush', 'hover'].forEach(k => set(k, false));
    set('shades', true);
    say(line, ms);
    clearTimeout(shades.t);
    shades.t = setTimeout(() => set('shades', false), ms);
  }
  face.addEventListener('dblclick', e => { e.preventDefault(); clicks = clicks.slice(0, -2); shades(2600, 'Deal with it 😎<small>data-driven &amp; dashboard-ready</small>'); });
  const code = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
  let progress = 0;
  window.addEventListener('keydown', e => {
    const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    progress = key === code[progress] ? progress + 1 : (key === code[0] ? 1 : 0);
    if (progress === code.length) {
      progress = 0;
      shades(5000, 'LEGENDARY MODE 😎✨<small>you found the secret</small>');
      if (!reduceMotion) for (let i = 0; i < 8; i++) setTimeout(() => fx('✨', '', 8 + Math.random() * 84, 10 + Math.random() * 60, 1400), i * 120);
    }
  });

  /* ---- coming back to the tab ---- */
  let leftAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { leftAt = performance.now(); return; }
    if (leftAt && performance.now() - leftAt > 4000 && mood === 'normal') {
      lastActive = performance.now();
      say('Welcome back! 😊');
      set('happy', true);
      setTimeout(() => set('happy', false), 1200);
    }
  });
})();
