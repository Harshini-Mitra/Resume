<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Harshini — Illustrated Avatar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#FBF1F0; --text:#3A2422; --muted:#8C6E6B; --pink:#F08A99; --ring:#F6C9CF; --skin:#EDB591; --skin-shade:#D9977A; }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; padding:24px 16px; overflow-x:hidden;
  }
  .stage{position:relative; width:min(360px, 84vw);}
  .stage.boing{animation:boing .5s cubic-bezier(.3,1.6,.5,1) 1;}
  @keyframes boing{0%{transform:scale(1);} 30%{transform:scale(1.05,.95);} 60%{transform:scale(.97,1.03);} 100%{transform:scale(1);}}
  .avatar{width:100%; height:auto; display:block; cursor:pointer; -webkit-tap-highlight-color:transparent; filter:drop-shadow(0 16px 30px rgba(160,80,90,.2));}
  #mouthSmile, #mouthOpen{transition:opacity .18s ease;}
  .bubble{
    position:absolute; top:-2%; right:-6%; background:#fff; color:var(--text); z-index:2;
    font-weight:700; font-size:14px; padding:9px 13px; border-radius:14px; line-height:1.3;
    opacity:0; transform:translateY(6px) scale(.9); transition:all .2s ease; pointer-events:none;
    box-shadow:0 6px 18px rgba(160,80,90,.25);
  }
  .bubble small{display:block; font-weight:500; font-size:11.5px; color:var(--muted);}
  .bubble::after{content:""; position:absolute; left:16px; bottom:-7px; border:8px solid transparent; border-top-color:#fff; border-bottom:0;}
  .bubble.show{opacity:1; transform:translateY(0) scale(1);}
  .spark{position:absolute; font-size:18px; pointer-events:none; animation:float 1.2s ease-out forwards; z-index:2;}
  @keyframes float{0%{opacity:0; transform:translateY(0) scale(.6);} 20%{opacity:1;} 100%{opacity:0; transform:translateY(-70px) scale(1.1);}}
  .hint{margin-top:26px; font-size:13px; color:var(--muted); text-align:center;}
  .links{margin-top:14px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
  .links a{color:var(--text); text-decoration:none; font-size:13px; border:1px solid var(--ring); background:#fff; padding:6px 12px; border-radius:999px;}
  .links a:hover{border-color:var(--pink); color:#C2566A;}
  @media (prefers-reduced-motion: reduce){ .spark{display:none;} .stage.boing{animation:none;} }
</style>
</head>

<script>
(() => {
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const svg = document.getElementById('avatar');
  const $ = id => document.getElementById(id);
  const faceBase = $('faceBase'), head = $('head'), features = $('features'), frontHair = $('frontHair'), backHair = $('backHair');
  const lockStrands = $('lockStrands'), lockL = $('lockL'), lockR = $('lockR'), earL = $('earL'), earR = $('earR');
  const brows = $('brows'), breathG = $('breath'), smile = $('mouthSmile'), open = $('mouthOpen');
  const lerp = (a, b, t) => a + (b - a) * t;

  // ---- eyes: iris follows; lids are a bezier edge that moves between open, shut and smiling ----
  const eyes = [...svg.querySelectorAll('.eye')].map(g => {
    const n = k => +g.dataset[k];
    return {
      cx: n('cx'), cy: n('cy'), i: [n('ix'), n('iy')], o: [n('ox'), n('oy')],
      up: [[n('c1x'), n('c1y')], [n('c2x'), n('c2y')]], low: [[n('d1x'), n('d1y')], [n('d2x'), n('d2y')]],
      iris: g.querySelector('.iris'), lidUp: g.querySelector('.lidUp'), lidLow: g.querySelector('.lidLow'),
      lash: g.querySelector('.lash'),
    };
  });
  const mix = (A, B, t) => A.map((p, k) => [lerp(p[0], B[k][0], t), lerp(p[1], B[k][1], t)]);
  const curve = (e, c) => `M${e.i[0]} ${e.i[1]} C${c[0][0]} ${c[0][1]} ${c[1][0]} ${c[1][1]} ${e.o[0]} ${e.o[1]}`;
  function drawLids(close, happy){
    eyes.forEach(e => {
      const shut = mix(e.up, e.low, 0.85);
      const smileArc = [[e.up[0][0], e.cy - 7], [e.up[1][0], e.cy - 8]];
      const upper = mix(mix(e.up, shut, close), smileArc, happy);
      const lower = mix(e.low, smileArc, happy);
      e.lidUp.setAttribute('d', `${curve(e, upper)} L${e.o[0]} ${e.cy - 40} L${e.i[0]} ${e.cy - 40} Z`);
      e.lidLow.setAttribute('d', happy > 0.01 ? `${curve(e, lower)} L${e.o[0]} ${e.cy + 40} L${e.i[0]} ${e.cy + 40} Z` : '');
      e.lash.setAttribute('d', curve(e, upper));
    });
  }

  // ---- where she looks: spring toward the pointer so the head leans, overshoots and settles ----
  const target = {x: 0, y: 0}, pos = {x: 0, y: 0}, vel = {x: 0, y: 0};
  let lastMove = performance.now(), hovering = false;
  function aim(clientX, clientY){
    lastMove = performance.now();
    const pt = new DOMPoint(clientX, clientY).matrixTransform(svg.getScreenCTM().inverse());
    const dx = pt.x - 200, dy = pt.y - 215;
    const reach = 240;
    target.x = Math.max(-1, Math.min(1, dx / reach));
    target.y = Math.max(-1, Math.min(1, dy / reach));
    hovering = Math.hypot(pt.x - 200, pt.y - 210) < 198;
  }
  window.addEventListener('pointermove', e => aim(e.clientX, e.clientY));
  window.addEventListener('pointerdown', e => aim(e.clientX, e.clientY));
  document.addEventListener('pointerleave', () => { hovering = false; });

  // glance around on her own when nobody is moving the pointer (also covers phones)
  setInterval(() => {
    if (performance.now() - lastMove > 3000) {
      hovering = false;
      target.x = Math.random() * 1.4 - 0.7;
      target.y = Math.random() * 1.0 - 0.5;
    }
  }, 1900);

  // ---- blinking ----
  let blinkStart = -1, happyUntil = 0;
  function scheduleBlink(){
    setTimeout(() => {
      blinkStart = performance.now();
      if (Math.random() < 0.2) setTimeout(() => { blinkStart = performance.now(); }, 260);
      scheduleBlink();
    }, 2400 + Math.random() * 3600);
  }
  if (!reduceMotion) scheduleBlink();

  let swing = 0, swingVel = 0, happy = 0;
  function frame(t){
    const now = performance.now();
    if (reduceMotion) {
      pos.x = target.x; pos.y = target.y;
    } else {
      for (const k of ['x', 'y']) {
        vel[k] += (target[k] - pos[k]) * 0.08;
        vel[k] *= 0.78;
        pos[k] += vel[k];
      }
    }
    // eyes look further than the head turns
    eyes.forEach(e => e.iris.setAttribute('transform', `translate(${pos.x * 8} ${pos.y * 4.5})`));
    features.setAttribute('transform', `translate(${pos.x * 5} ${pos.y * 3})`);
    faceBase.setAttribute('transform', `translate(${pos.x * 3} ${pos.y * 2})`);
    frontHair.setAttribute('transform', `translate(${pos.x * 3} ${pos.y * 2})`);
    backHair.setAttribute('transform', `translate(${-pos.x * 4} ${-pos.y * 2})`);
    head.setAttribute('transform', `rotate(${pos.x * 3} 200 320)`);
    brows.setAttribute('transform', `translate(0 ${Math.min(0, pos.y) * 3 - (hovering || happy > 0 ? 3 : 0)})`);

    if (!reduceMotion) {
      // hair and earrings trail behind head movement, plus a gentle idle sway
      swingVel += (-vel.x * 30 - swing) * 0.06;
      swingVel *= 0.85;
      swing = Math.max(-5, Math.min(5, swing + swingVel));
      const sway = Math.sin(t / 1800) * 1.2;
      lockL.setAttribute('transform', `rotate(${swing + sway} 160 80)`);
      lockStrands.setAttribute('transform', `rotate(${swing} 200 80)`);
      lockR.setAttribute('transform', `rotate(${swing - sway} 240 80)`);
      earL.setAttribute('transform', `rotate(${swing * 2 + sway * 3} 130 250)`);
      earR.setAttribute('transform', `rotate(${swing * 2 - sway * 3} 270 250)`);
      breathG.setAttribute('transform', `translate(0 ${Math.sin(t / 1600) * 2.5})`);
    }

    // eyelids: blink curve, or happy ^ ^ after a click
    const want = now < happyUntil ? 1 : 0;
    happy += (want - happy) * (reduceMotion ? 1 : 0.25);
    let close = 0;
    if (blinkStart > 0) {
      const p = (now - blinkStart) / 170;
      close = p < 1 ? Math.sin(p * Math.PI) : 0;
      if (p >= 1) blinkStart = -1;
    }
    drawLids(close, happy);

    const grin = hovering || happy > 0.5;
    smile.style.opacity = grin ? 0 : 1;
    open.style.opacity = grin ? 1 : 0;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---- click: happy eyes, little bounce, speech bubble and a few sparkles ----
  const stage = $('stage'), bubble = $('bubble');
  let timer;
  svg.addEventListener('click', () => {
    happyUntil = performance.now() + 1400;
    bubble.classList.add('show');
    stage.classList.remove('boing'); void stage.offsetWidth; stage.classList.add('boing');
    if (!reduceMotion) {
      for (let i = 0; i < 4; i++) {
        const s = document.createElement('span');
        s.className = 'spark';
        s.textContent = '✨';
        s.style.left = (12 + Math.random() * 76) + '%';
        s.style.top = (20 + Math.random() * 40) + '%';
        s.style.animationDelay = (i * 0.1) + 's';
        stage.appendChild(s);
        setTimeout(() => s.remove(), 1500);
      }
    }
    clearTimeout(timer);
    timer = setTimeout(() => bubble.classList.remove('show'), 1800);
  });
})();
</script>
</body>
</html>
